# Where each secret lives (docs/howto/secrets-openbao.md). Not secret: key names only.
# Read by bin/lib/platform.sh (secrets_policy), bin/bao-import-sops, bin/bao-secret, bin/gen-service-secrets
# and playbooks/openbao-smoke.yml. Regexes match whole key names.
#
# sops_only: stays in ansible/inventories/<env>/group_vars/all/secrets.sops.yml and never goes to OpenBao.
#   Tier 0, what builds or unseals the platform itself: openbao_*, tofu_state_*, stepca_*.
#   Break-glass, what must work with bao01 down: the PBS encryption key (restoring pg01 and bao01 needs it)
#   and the UniFi credentials (a firewall mistake that cuts the controller off from bao01 is fixed with them).
sops_only: '^(secrets_file_version|openbao_.*|tofu_state_.*|stepca_.*|pbs_encryption_key|unifi_.*)$'
# tofu_owned: written by OpenTofu into kv/services/<env>/tf-authentik (tofu/authentik/<env>). Nobody sets
#   these by hand; bin/bao-import-sops and bin/bao-secret leave them alone.
tofu_owned: '^(forgejo_oidc_client_secret|nextcloud_oidc_client_secret|audiobookshelf_oidc_client_secret|vaultwarden_oidc_client_secret|headscale_oidc_client_secret|jellyfin_ldap_bind_password|jellyfin_oidc_client_secret|proxmox_oidc_client_secret)$'
