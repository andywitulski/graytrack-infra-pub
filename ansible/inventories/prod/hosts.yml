---
# Prod inventory: nodes, guests, and one group per role.
# Plays target role groups, never host names, so moving a service only changes this file.
# Shared settings live in inventories/common (loaded first); dev mirrors this file's structure.
# pve_vmid / storage_address must match tofu/envs/prod.
all:
  children:
    pve_nodes:
      hosts:
        pve01:
          ansible_host: __MGMT_NET__.2
        pve02:
          ansible_host: __MGMT_NET__.3
        pve03:
          ansible_host: __MGMT_NET__.5

    service_guests:
      vars:
        ansible_user: ansible
      children:
        docker_hosts:
          hosts:
            edge01:
              ansible_host: __DMZ_NET__.10
            idp01:
              ansible_host: __SVC_NET__.11
            git01:
              ansible_host: __SVC_NET__.12
            cloud01:
              ansible_host: __SVC_NET__.13
              storage_address: __STOR_NET__.13
            pw01:
              ansible_host: __SVC_NET__.16
            mdm01:
              ansible_host: __SVC_NET__.17
            siem01:
              ansible_host: __SEC_NET__.10
        lxc_guests:
          hosts:
            ai01:
              ansible_host: __SVC_NET__.14
              pve_vmid: 4141
            media01:
              ansible_host: __SVC_NET__.20
              pve_vmid: 4201
            sync01:
              ansible_host: __SVC_NET__.21
              pve_vmid: 4211
            files01:
              ansible_host: __SVC_NET__.22
              pve_vmid: 4221
            hs01:
              ansible_host: __SVC_NET__.23
              pve_vmid: 4231
            ts01:
              ansible_host: __SVC_NET__.24
              pve_vmid: 4241
            ts02:
              ansible_host: __SVC_NET__.25
              pve_vmid: 4251
            mail01:
              ansible_host: __SVC_NET__.26
              pve_vmid: 4261
        # tofu/platform/prod (mgmt VLAN): state backend and secrets manager
        platform_guests:
          hosts:
            pg01:
              ansible_host: __MGMT_NET__.22
              pve_vmid: 4301
            bao01:
              ansible_host: __MGMT_NET__.23
              pve_vmid: 4311
            ca01:
              ansible_host: __MGMT_NET__.24
              pve_vmid: 4321
        siem:
          hosts:
            siem01:
        pbs_hosts:
          hosts:
            pbs01:
              ansible_host: __MGMT_NET__.21
              storage_address: __STOR_NET__.21
              pve_vmid: 4151

    storage_nodes:
      hosts:
        pve03:

    # role groups
    caddy:
      hosts:
        edge01:
    authentik:
      hosts:
        idp01:
    forgejo:
      hosts:
        git01:
    nextcloud:
      hosts:
        cloud01:
    vaultwarden:
      hosts:
        pw01:
    # Device management (docs/howto/mdm.md): Fleet, Apple MDM for managed iPhones and iPads
    fleet:
      hosts:
        mdm01:
    # Remote access (docs/howto/vpn.md): Headscale coordination server, and the Tailscale subnet router
    headscale:
      hosts:
        hs01:
    tailscale_router:
      hosts:
        ts01:
    # Exit node: the full tunnel for devices granted in headscale_exits (roaming device, public Wi-Fi)
    tailscale_exit:
      hosts:
        ts02:
    # Mail, stage 1 (docs/howto/mail.md): Stalwart mailboxes at home, Gmail and Proton synced in.
    # Stage 2 (docs/howto/mail-public-edge.md) adds the Hetzner VPS (tofu/cloud/prod) as the MX and outbound relay.
    mail:
      hosts:
        mail01:
    nfs_clients:
      hosts:
        cloud01:
        pbs01:
    samba:
      hosts:
        files01:
    syncthing:
      hosts:
        sync01:
    media:
      hosts:
        media01:
    ollama:
      hosts: {}
        # ai01:
    pbs:
      hosts:
        pbs01:
    wazuh_manager:
      hosts:
        siem01:
    postgres:
      hosts:
        pg01:
    openbao:
      hosts:
        bao01:
    step_ca:
      hosts:
        ca01:
    wazuh_agents:
      children:
        pve_nodes:
        service_guests:
    # TPM 2.0 (roles/tpm, playbooks/tpm.yml, ADR-0006). vtpm_guests: VMs created with vtpm = true in
    # tofu/envs/<env>. LXCs have no TPM of their own. Nodes are inventoried when they have one.
    vtpm_guests:
      children:
        docker_hosts:
        pbs_hosts:
    tpm_hosts:
      children:
        pve_nodes:
        vtpm_guests:
