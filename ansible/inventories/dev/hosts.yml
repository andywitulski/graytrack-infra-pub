---
# Dev inventory: same groups and roles as inventories/prod, on the nested cluster (pvedev1-3 on the labnode node,
# created by tofu/envs/labnode with -var build_dev=true; run from paw01, the only machine on __DEV_NET__.0/24).
# Flat __DEV_NET__.0/24 (NAT, no VLANs or UniFi firewall); storage network __DEV_STOR_NET__.0/24 like prod's .130.
# Shared settings live in inventories/common. pve_vmid / storage_address must match tofu/envs/dev.
all:
  children:
    pve_nodes:
      hosts:
        pvedev1:
          ansible_host: __DEV_NET__.11
        pvedev2:
          ansible_host: __DEV_NET__.12
        pvedev3:
          ansible_host: __DEV_NET__.13

    service_guests:
      vars:
        ansible_user: ansible
      children:
        docker_hosts:
          hosts:
            edge01:
              ansible_host: __DEV_NET__.41
            idp01:
              ansible_host: __DEV_NET__.42
            git01:
              ansible_host: __DEV_NET__.43
            cloud01:
              ansible_host: __DEV_NET__.44
              storage_address: __DEV_STOR_NET__.44
            siem01:
              ansible_host: __DEV_NET__.40
        lxc_guests:
          hosts:
            media01:
              ansible_host: __DEV_NET__.50
              pve_vmid: 1201
            sync01:
              ansible_host: __DEV_NET__.51
              pve_vmid: 1211
            files01:
              ansible_host: __DEV_NET__.52
              pve_vmid: 1221
        # tofu/platform/dev: state backend and secrets manager
        platform_guests:
          hosts:
            pg01:
              ansible_host: __DEV_NET__.60
              pve_vmid: 1301
            bao01:
              ansible_host: __DEV_NET__.61
              pve_vmid: 1311
            ca01:
              ansible_host: __DEV_NET__.62
              pve_vmid: 1321
        siem:
          hosts:
            siem01:
        pbs_hosts:
          hosts:
            pbs01:
              ansible_host: __DEV_NET__.46
              storage_address: __DEV_STOR_NET__.46
              pve_vmid: 1151

    storage_nodes:
      hosts:
        pvedev3:

    # role groups
    caddy:
      hosts:
        edge01:
    authentik:
      hosts:
        idp01:
    forgejo:
      hosts:
        git01:
    nextcloud:
      hosts:
        cloud01:
    nfs_clients:
      hosts:
        cloud01:
        pbs01:
    samba:
      hosts:
        files01:
    syncthing:
      hosts:
        sync01:
    media:
      hosts:
        media01:
    ollama:
      hosts: {} # no ai01 in dev (no GPU, and prod's is not built yet)
    pbs:
      hosts:
        pbs01:
    wazuh_manager:
      hosts:
        siem01:
    postgres:
      hosts:
        pg01:
    openbao:
      hosts:
        bao01:
    step_ca:
      hosts:
        ca01:
    wazuh_agents:
      children:
        pve_nodes:
        service_guests:
    # TPM 2.0 (roles/tpm, playbooks/tpm.yml, ADR-0006). vtpm_guests: VMs created with vtpm = true in
    # tofu/envs/<env>. LXCs have no TPM of their own. Nodes are inventoried when they have one.
    vtpm_guests:
      children:
        docker_hosts:
        pbs_hosts:
    tpm_hosts:
      children:
        pve_nodes:
        vtpm_guests:
