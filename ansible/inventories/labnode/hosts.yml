---
# labnode inventory: one standalone Proxmox node (a repurposed workstation) and the guests it runs.
# Not a member of the prod cluster (pve01-03): a laptop as a fourth voter would make quorum fragile.
# It sits on the prod network like the cluster nodes (Management VLAN, "Node trunk" switch port) and uses
# prod's platform tier: state in pg01 (schema labnode), host and user certificates from prod's ca01.
# Shared settings live in inventories/common. VM IDs and addresses must match tofu/envs/labnode and
# ansible/network/zone_policy.yml (unifi_nodes, unifi_paw, unifi_gpu).
#
#   paw01   admin workstation VM and second controller (the admin workstation is the other)
#   gpu01   ollama on the passed-through discrete GPU, and the rag database (pgvector), on Services
#   kali01  Kali on its own internet-only SDN network (kalinet): no Ansible, not in this inventory
#   pvedev1-3 (dev cluster) are created here by tofu but managed through inventories/dev, from paw01
#   (the only machine with a leg on the dev network, __DEV_NET__.2).
all:
  children:
    pve_nodes:
      hosts:
        labnode:
          ansible_host: __MGMT_NET__.4

    service_guests:
      vars:
        ansible_user: ansible
      hosts:
        paw01:
          ansible_host: __MGMT_NET__.30
        gpu01:
          ansible_host: __SVC_NET__.15

    # role groups
    paw:
      hosts:
        paw01:
    gpu_guests:
      hosts:
        gpu01:
    ollama:
      hosts:
        gpu01:
    rag_db: # PostgreSQL + pgvector (group_vars/rag_db.yml)
      hosts:
        gpu01:
    wazuh_agents: # Wazuh agents reporting to prod's siem01 (group_vars/all/main.yml)
      hosts:
        labnode:
        paw01:
        gpu01:
    # TPM 2.0 (roles/tpm, playbooks/tpm.yml, ADR-0006): the VMs with tpm_state in tofu/envs/labnode, and the node
    vtpm_guests:
      hosts:
        paw01:
        gpu01:
    tpm_hosts:
      children:
        pve_nodes:
        vtpm_guests:
