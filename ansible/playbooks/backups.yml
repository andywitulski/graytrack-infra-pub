---
# PBS server, then the cluster's side: the PBS storage entry and the nightly backup job.
# The token secret comes from OpenBao (pbs_cluster_token_secret, bin/bao-secret); the fingerprint is read live from PBS.
# An inventory without a pbs group (labnode) describes the server in pbs_remote instead
# (inventories/labnode/group_vars/all/backups.yml) and backs up the VM IDs it lists.
# pbs_encryption_key: the key JSON from sops. While it is PENDING the storage is created with
# 'autogen' and the generated key must be saved off the cluster (docs/howto/backups-pbs.md).

- name: Backup server
  hosts: pbs
  become: true
  roles:
    - pbs

- name: Cluster backup storage and job (cluster-wide, run on one node)
  hosts: pve_nodes[0]
  become: true
  vars:
    # Lazy if/else: in an inventory without a pbs group the prod branch is never evaluated.
    pbs_target: >-
      {{ pbs_remote if pbs_remote is defined else {
           'ssh_host': groups['pbs'][0],
           'address': hostvars[groups['pbs'][0]]['ansible_host'],
           'datastore': hostvars[groups['pbs'][0]]['pbs_datastore_name'],
           'auth_id': hostvars[groups['pbs'][0]]['pbs_cluster_user'] ~ '!' ~ hostvars[groups['pbs'][0]]['pbs_cluster_token'],
           'storage_id': groups['pbs'][0],
           'schedule': '02:00',
           'exclude': [hostvars[groups['pbs'][0]]['pve_vmid']] } }}
    pbs_storage_id: "{{ pbs_target.storage_id }}"
  tasks:
    - name: Read cluster storage
      ansible.builtin.command: pvesh get /storage --output-format json
      register: pve_storage
      changed_when: false
      check_mode: false

    - name: PBS storage entry
      when: pbs_storage_id not in (pve_storage.stdout | from_json | map(attribute='storage') | list)
      block:
        - name: Token secret is stored
          ansible.builtin.assert:
            that: pbs_cluster_token_secret | default('PENDING') != 'PENDING'
            fail_msg: >-
              Store pbs_cluster_token_secret first: bin/bao-secret {{ lab_env }} set pbs_cluster_token_secret
              (the pbs role leaves a new token on the PBS host).
            quiet: true

        - name: PBS certificate fingerprint (read live, never copied by hand)
          ansible.builtin.command: proxmox-backup-manager cert info
          delegate_to: "{{ pbs_target.ssh_host }}"
          register: pbs_cert
          changed_when: false
          check_mode: false

        - name: Add the storage
          vars:
            pbs_fingerprint_live: "{{ pbs_cert.stdout | regex_search('Fingerprint \\(sha256\\):\\s*(\\S+)', '\\1') | first }}"
            pbs_key: "{{ pbs_encryption_key | default('PENDING') }}"
          ansible.builtin.command:
            argv:
              - pvesh
              - create
              - /storage
              - --storage
              - "{{ pbs_storage_id }}"
              - --type
              - pbs
              - --server
              - "{{ pbs_target.address }}"
              - --datastore
              - "{{ pbs_target.datastore }}"
              - --username
              - "{{ pbs_target.auth_id }}"
              - --password
              - "{{ pbs_cluster_token_secret }}"
              - --fingerprint
              - "{{ pbs_fingerprint_live }}"
              - --encryption-key
              - "{{ 'autogen' if pbs_key == 'PENDING' else (pbs_key if pbs_key is string else pbs_key | to_json) }}"
              - --content
              - backup
          changed_when: true
          no_log: true

        - name: Save the generated encryption key now
          ansible.builtin.debug:
            msg: >-
              The storage was created with a NEW encryption key in /etc/pve/priv/storage/{{ pbs_storage_id }}.enc.
              Backups are unreadable without it: store it in sops as pbs_encryption_key and on paper
              (docs/howto/backups-pbs.md).
          when: pbs_encryption_key | default('PENDING') == 'PENDING'

    - name: Storage pins PBS's current certificate (it changes with playbooks/admin-tls.yml)
      ansible.builtin.include_tasks: tasks/pbs_fingerprint.yml
      vars:
        pbs_fp_host: "{{ pbs_target.ssh_host }}"

    - name: Read backup jobs
      ansible.builtin.command: pvesh get /cluster/backup --output-format json
      register: pve_backup_jobs
      changed_when: false
      check_mode: false

    # Only when no job targets the PBS storage yet, so a job made by hand is never duplicated.
    - name: Nightly backup of every guest except PBS itself
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/backup
          - --id
          - nightly-pbs
          - --schedule
          - "{{ pbs_target.schedule }}"
          - --storage
          - "{{ pbs_storage_id }}"
          - --all
          - "1"
          - --exclude
          - "{{ pbs_target.exclude | join(',') }}"
          - --mode
          - snapshot
          - --enabled
          - "1"
          - --notes-template
          - "{{ '{{guestname}}' }}"
      when:
        - pve_backup_jobs.stdout | from_json | selectattr('storage', 'defined') | selectattr('storage', 'equalto', pbs_storage_id) | list | length == 0
        - pbs_target.vmids is not defined
      changed_when: true

    - name: Nightly backup of the listed guests (pbs_remote.vmids)
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/backup
          - --id
          - nightly-pbs
          - --schedule
          - "{{ pbs_target.schedule }}"
          - --storage
          - "{{ pbs_storage_id }}"
          - --vmid
          - "{{ pbs_target.vmids | join(',') }}"
          - --mode
          - snapshot
          - --enabled
          - "1"
          - --notes-template
          - "{{ '{{guestname}}' }}"
      when:
        - pve_backup_jobs.stdout | from_json | selectattr('storage', 'defined') | selectattr('storage', 'equalto', pbs_storage_id) | list | length == 0
        - pbs_target.vmids is defined
      changed_when: true
