---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# step-ca rereads ca.json, provisioners and templates on SIGHUP. Restart only for keys and units.
- name: Reload step-ca
  ansible.builtin.service:
    name: "{{ item }}"
    state: reloaded
  loop: "{{ step_ca_units }}"

- name: Restart step-ca
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ step_ca_units }}"
