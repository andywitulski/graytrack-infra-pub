---
# One host: what is pending, the upgrade, what still needs a restart, the reboot when asked, health.
- name: Needrestart (finds outdated services and kernels)
  ansible.builtin.apt:
    name: needrestart
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Needrestart settings
  ansible.builtin.template:
    src: needrestart.conf.j2
    dest: /etc/needrestart/conf.d/90-labstack.conf
    owner: root
    group: root
    mode: "0644"

- name: Failed units before (only new failures count afterwards) # noqa: command-instead-of-module (read-only query, no module reports it)
  ansible.builtin.command: systemctl list-units --failed --plain --no-legend
  register: patch_failed_before
  changed_when: false
  check_mode: false

- name: Package lists
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 600
  changed_when: false

- name: What a full upgrade would install (simulation) # noqa: command-instead-of-module (read-only query, no module reports it)
  ansible.builtin.command: apt-get -s -o Debug::NoLocking=1 dist-upgrade
  register: patch_sim
  changed_when: false
  check_mode: false

- name: Held packages (stay at their version)
  ansible.builtin.command: apt-mark showhold
  register: patch_holds
  changed_when: false
  check_mode: false

- name: Pending packages
  ansible.builtin.set_fact:
    patch_pending: "{{ patch_sim.stdout | regex_findall('(?m)^Inst (\\S+)') }}"
    patch_held: "{{ patch_holds.stdout_lines }}"

- name: Pending on this host
  ansible.builtin.debug:
    msg: "{{ (patch_pending | length) }} to upgrade: {{ patch_pending | join(' ') if patch_pending else 'nothing' }}{{
             ('; held: ' ~ (patch_held | join(' '))) if patch_held else '' }}"

# full-upgrade, never plain upgrade: Proxmox supports only this, and a plain upgrade holds back whatever
# needs a new dependency. Keeps changed config files as they are (dpkg force-confdef, force-confold).
- name: Full upgrade
  ansible.builtin.apt:
    upgrade: dist
    autoremove: "{{ patch_autoremove | bool }}"
    lock_timeout: 600
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: "{{ patch_needrestart_mode }}"
  when: patch_pending | length > 0

# A first --check only simulates the needrestart install: no binary yet, so no report on that run
- name: Needrestart installed?
  ansible.builtin.stat:
    path: /usr/sbin/needrestart
  register: patch_nr_bin

- name: What still needs a restart (needrestart batch report)
  ansible.builtin.command: needrestart -b -r l
  register: patch_nr
  changed_when: false
  check_mode: false
  when: patch_nr_bin.stat.exists

- name: Reboot required?
  ansible.builtin.stat:
    path: /run/reboot-required
  register: patch_reboot_flag

- name: Restart state
  vars:
    patch_ksta: "{{ (patch_nr.stdout | default('')) | regex_search('NEEDRESTART-KSTA: (\\d)', '\\1') | default(['0'], true) | first }}"
    patch_ucsta: "{{ (patch_nr.stdout | default('')) | regex_search('NEEDRESTART-UCSTA: (\\d)', '\\1') | default(['0'], true) | first }}"
  ansible.builtin.set_fact:
    # KSTA 2 or 3: a newer kernel is installed than the one running. UCSTA 2: newer microcode.
    patch_needs_reboot: >-
      {{ ansible_facts['virtualization_type'] != 'lxc'
         and (patch_ksta | int in [2, 3] or patch_ucsta | int == 2 or patch_reboot_flag.stat.exists) }}
    patch_kernel: "{{ (patch_nr.stdout | default('')) | regex_search('NEEDRESTART-KCUR: (\\S+)', '\\1') | default(['?'], true) | first }}
                   {{ ('to ' ~ ((patch_nr.stdout | default('')) | regex_search('NEEDRESTART-KEXP: (\\S+)', '\\1') | default(['?'], true) | first))
                      if patch_ksta | int in [2, 3] else '' }}"
    patch_services: "{{ (patch_nr.stdout | default('')) | regex_findall('(?m)^NEEDRESTART-SVC: (\\S+)') }}"

- name: Restart the outdated services (guests; nodes wait for their reboot)
  ansible.builtin.command: needrestart -r a -q
  when:
    - patch_needrestart_mode == 'a'
    - patch_services | length > 0
  changed_when: true

- name: Services still outdated after the restart
  ansible.builtin.command: needrestart -b -r l
  register: patch_nr_after
  changed_when: false
  check_mode: false
  when:
    - patch_services | length > 0
    - patch_nr_bin.stat.exists

- name: Controller running this play
  ansible.builtin.set_fact:
    patch_controller: "{{ lookup('ansible.builtin.pipe', 'hostname -s') }}"

- name: Is a reboot possible from here?
  ansible.builtin.set_fact:
    patch_reboot_blocked: >-
      {{ inventory_hostname == patch_controller or patch_controller in patch_hosts_controllers }}

- name: Reboot (one host at a time)
  ansible.builtin.reboot:
    msg: "Reboot by Ansible (labstack-infra, playbooks/patch.yml) after updates"
    reboot_timeout: "{{ patch_reboot_timeout }}"
  register: patch_rebooted
  when:
    - patch_reboot | bool
    - patch_needs_reboot | bool
    - not patch_reboot_blocked | bool
    - not ansible_check_mode

- name: Health
  ansible.builtin.include_tasks: health.yml
  when: not ansible_check_mode

- name: Result for the summary
  ansible.builtin.set_fact:
    patch_result:
      upgraded: "{{ patch_pending | length }}"
      held: "{{ patch_held }}"
      kernel: "{{ patch_kernel | trim }}"
      reboot: >-
        {{ 'done' if (patch_rebooted is defined and patch_rebooted is changed)
           else ('needed (runs this controller: reboot it from the other one)' if patch_needs_reboot | bool and patch_reboot_blocked | bool
           else ('needed' if patch_needs_reboot | bool else 'no')) }}
      services_outdated: >-
        {{ (patch_nr_after.stdout | default('') | regex_findall('(?m)^NEEDRESTART-SVC: (\S+)'))
           if (patch_rebooted is not defined or patch_rebooted is not changed) else [] }}
