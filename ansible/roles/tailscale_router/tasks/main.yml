---
- name: The coordination server exists in this inventory
  ansible.builtin.assert:
    that: groups['headscale'] | default([]) | length > 0
    fail_msg: "No headscale group in this inventory (inventories/<env>/hosts.yml)"
    quiet: true

- name: A known role
  ansible.builtin.assert:
    that: tailscale_router_role in ['subnet', 'exit']
    fail_msg: "tailscale_router_role is subnet or exit, not {{ tailscale_router_role }}"
    quiet: true

- name: Settings from the coordination server's group
  vars:
    hs: "{{ hostvars[groups['headscale'][0]] }}"
  ansible.builtin.set_fact:
    tailscale_router_hs: "{{ groups['headscale'][0] }}"
    tailscale_router_url: "https://{{ hs['headscale_domain'] }}"
    # An exit node advertises the default routes; Headscale shows them as its routes
    tailscale_router_routes: "{{ hs['headscale_routes'] if tailscale_router_role == 'subnet' else ['0.0.0.0/0', '::/0'] }}"
    tailscale_router_tag: >-
      {{ hs['headscale_router_tag'] | default('tag:router') if tailscale_router_role == 'subnet'
         else tailscale_router_exit_tag }}

- name: Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: ["{{ tailscale_router_repo }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "{{ tailscale_router_key_url }}"
    state: present

- name: Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

# Forwarding is per network namespace, so this works inside the (unprivileged) container
- name: Forward packets between the tunnel and the lab
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-tailscale-router.conf
    content: |
      # Managed by Ansible (labstack-infra): ts01 routes VPN traffic into the lab
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Apply forwarding now
  ansible.builtin.meta: flush_handlers

- name: The TUN device is there (roles/pve_lxc_host, pve_lxc_host_extra_containers)
  ansible.builtin.stat:
    path: /dev/net/tun
  register: tailscale_router_tun
  failed_when: not tailscale_router_tun.stat.exists

- name: Tailscaled's UDP port
  ansible.builtin.lineinfile:
    path: /etc/default/tailscaled
    regexp: '^PORT='
    line: 'PORT="{{ tailscale_router_port }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart tailscaled

- name: Tailscaled running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Port change applied
  ansible.builtin.meta: flush_handlers

- name: Current state
  ansible.builtin.command: tailscale status --json --peers=false
  register: tailscale_router_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Join the tailnet (first run, or after the node was deleted in Headscale)
  when: (tailscale_router_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
  block:
    - name: Single-use pre-auth key, tagged, valid 10 minutes (on hs01)
      ansible.builtin.command: >-
        headscale preauthkeys create --tags {{ tailscale_router_tag }} --expiration 10m --output json
      delegate_to: "{{ tailscale_router_hs }}"
      register: tailscale_router_key
      changed_when: true
      no_log: true

    - name: Key file (never on a command line)
      ansible.builtin.copy:
        dest: /run/tailscale-authkey
        content: "{{ (tailscale_router_key.stdout | from_json).key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Tailscale up (subnet router or exit node)
      ansible.builtin.command:
        argv: "{{ tailscale_router_up_common + tailscale_router_up_role }}"
      vars:
        tailscale_router_up_common:
          - tailscale
          - up
          - --login-server={{ tailscale_router_url }}
          - --auth-key=file:/run/tailscale-authkey
          - --hostname={{ inventory_hostname }}
          # Every setting is given here, so start from a clean slate: a half-finished earlier attempt can leave
          # settings behind that "tailscale up" otherwise refuses to drop
          - --reset
          # No --advertise-tags: the pre-auth key carries the tag, and Headscale 0.28+ refuses a key
          # registration that also requests tags ("requested tags ... are invalid or not permitted")
          - --accept-dns=false
          - --accept-routes=false
          - --timeout=60s
        tailscale_router_up_role: >-
          {{ ['--advertise-routes=' ~ tailscale_router_routes | join(','), '--snat-subnet-routes=true']
             if tailscale_router_role == 'subnet' else ['--advertise-exit-node'] }}
      changed_when: true

  always:
    - name: Remove the key file
      ansible.builtin.file:
        path: /run/tailscale-authkey
        state: absent

- name: Routes and settings as configured (also after a change to headscale_routes)
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_router_prefs
  changed_when: false
  check_mode: false

- name: Publish the configured routes
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "{{ ('--advertise-routes=' ~ tailscale_router_routes | join(',')) if tailscale_router_role == 'subnet' else '--advertise-exit-node' }}"
      - --accept-dns=false
  when: >-
    (tailscale_router_prefs.stdout | from_json).AdvertiseRoutes | default([], true) | sort
    != tailscale_router_routes | sort
  changed_when: true

- name: Headscale approved every route (autoApprovers in its policy)
  ansible.builtin.command: headscale nodes list-routes --output json
  delegate_to: "{{ tailscale_router_hs }}"
  register: tailscale_router_approved
  changed_when: false
  check_mode: false
  until: >-
    (tailscale_router_approved.stdout | from_json
     | selectattr('given_name', 'equalto', inventory_hostname) | map(attribute='approved_routes', default=[])
     | flatten | list) is superset(tailscale_router_routes)
  retries: 10
  delay: 3
