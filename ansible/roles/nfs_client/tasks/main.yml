---
- name: NFS client tools
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Mount points (before first mount)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_client_mounts }}"
  when: item.path not in (ansible_facts.mounts | map(attribute='mount') | list)

- name: NFS mounts over the storage network
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs4
    opts: "{{ nfs_client_options }}"
    state: mounted
  loop: "{{ nfs_client_mounts }}"
