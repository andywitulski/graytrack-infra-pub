---
- name: Restart stalwart
  ansible.builtin.systemd_service:
    name: stalwart
    state: restarted
    daemon_reload: true

- name: Reload stalwart settings
  ansible.builtin.command:
    argv: [stalwart-cli, create, Action/ReloadSettings, --json, "{}"]
  environment: "{{ mail_cli_env }}"
  changed_when: true

- name: Restart protonbridge
  ansible.builtin.systemd_service:
    name: protonbridge
    state: restarted
    daemon_reload: true
