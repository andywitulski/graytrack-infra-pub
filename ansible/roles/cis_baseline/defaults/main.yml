---
# CIS Debian 13 items that cost nothing in a lab (docs/compliance/cis-debian13-exceptions.md lists what is fixed here,
# what is accepted, and why). Applied to every service guest (services.yml) and every Proxmox node
# (telemetry-baseline.yml, with the node overrides below).
cis_baseline_permit_root_login: "no"             # nodes: prohibit-password (cluster SSH between nodes)
cis_baseline_ssh_disable_forwarding: true        # nodes: false (secure live migration tunnels over SSH)
cis_baseline_manage_issue: true                  # nodes: false (pvebanner rewrites /etc/issue at boot)
cis_baseline_banner: |
  Authorized use only. Activity on this system is logged and monitored.
cis_baseline_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
cis_baseline_remove_packages: [telnet, inetutils-telnet]
cis_baseline_cron_paths:
  - { path: /etc/crontab, mode: "0600" }
  - { path: /etc/cron.hourly, mode: "0700" }
  - { path: /etc/cron.daily, mode: "0700" }
  - { path: /etc/cron.weekly, mode: "0700" }
  - { path: /etc/cron.monthly, mode: "0700" }
  - { path: /etc/cron.d, mode: "0700" }
