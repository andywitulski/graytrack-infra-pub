---
# Exact version: the image is rebuilt only when this tag changes. 2.11.1 to 2.11.6 fixed matcher, FastCGI,
# admin API and forward_auth bypasses (CVE-2026-27585 to -27590 and later); 2.11.7 fixes 2.11.6 regressions.
# renovate: datasource=docker depName=docker.io/library/caddy
caddy_version: "2.11.7"
caddy_email: ""
caddy_dns_module: ""
caddy_dns_provider: ""
caddy_dns_propagation_delay: 90s
caddy_env: {}
caddy_forward_auth_upstream: "http://127.0.0.1:9000"
caddy_sites: []
caddy_dir: /opt/caddy
# Query parameters removed from access logs (credentials and one-time codes).
# setToken/accessToken: Audiobookshelf hands its session tokens to the web app in the OIDC return URL.
# enroll_secret: Fleet's device enrollment links carry it.
caddy_log_redact_query:
  [code, state, token, access_token, refresh_token, id_token, id_token_hint, client_secret, p, t, s, apiKey, setToken, accessToken,
   enroll_secret]
# Device trust (ADR-0006): sites with device_trust: true ask for a client certificate from ca01 and pass the
# verified key's hash to the upstream. Only while device_trust_mode (inventories/common) is not off.
caddy_device_trust: >-
  {{ (device_trust_mode | default('off')) != 'off'
     and (caddy_sites | selectattr('device_trust', 'defined') | selectattr('device_trust') | list | length > 0) }}
caddy_device_trust_ca_files:
  - "{{ ssh_ca_root_pem }}"
  - "{{ ssh_ca_files_dir }}/ca01-intermediate.pem"
