    line: >-
      Oct 28 22:57:30 git01 sshd-session[20311]: Accepted publickey for ansible from {{ wazuh_manager_automation_sources | first }} port 52892
      ssh2: ED25519-CERT SHA256:r5zFUmBc98FPPlq8lpm3986HhsZrTx7bpAbaOw5KlBw ID ansible@paw01
      (serial 4885765211517163206) CA ECDSA SHA256:4dWaiAHXk4I4G98ZcTYXghp0BvInxMsbBQF+EzVtynI
  - rule: "100451"
    line: >-
      Oct 28 23:02:31 git01 sshd-session[20377]: Accepted publickey for ansible from {{ wazuh_manager_automation_sources | first }} port 57320
      ssh2: ED25519-CERT SHA256:UqDaeHDLajRTXAPQD9GveznKcFwCmzSV15YC+jQ71Jo ID breakglass:ansible@paw01:20261028T230220Z
      (serial 1761692540) CA ECDSA SHA256:4dWaiAHXk4I4G98ZcTYXghp0BvInxMsbBQF+EzVtynI
