      PHYSOUT=tap4101i0 MAC=00:00:5e:00:53:0f:00:00:5e:00:53:20:08:00 SRC=__LAN_NET__.6 DST=__DMZ_NET__.10 LEN=60 TOS=0x00
      PREC=0x00 TTL=63 ID=0 DF PROTO=TCP SPT=51515 DPT=8080 SEQ=1 ACK=0 WINDOW=64240 SYN
  - rule: "100422"
    line: >-
      4111 6 tap4111i0-IN 10/Oct/2026:09:15:01 -0400 policy DROP: IN=fwbr4111i0 OUT=fwbr4111i0 PHYSIN=fwln4111i0
      PHYSOUT=tap4111i0 MAC=00:00:5e:00:53:0f:00:00:5e:00:53:20:08:00 SRC=__SVC_NET__.13 DST=__SVC_NET__.11 LEN=60 TOS=0x00
      PREC=0x00 TTL=64 ID=0 DF PROTO=TCP SPT=40404 DPT=22 SEQ=1 ACK=0 WINDOW=64240 SYN
  # Broadcast (a DHCP discover) and multicast (an MLD report): seen by every guest on the VLAN
