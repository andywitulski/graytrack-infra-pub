# ---------------------------------------------------------------- dashboard login through Authentik (tasks/sso.yml)
# Runs once this environment's SAML metadata is in the repo:
#   bin/tf-ak <env> output -raw wazuh_saml_metadata > ansible/files/<env>/wazuh-saml-metadata.xml
# Secret: wazuh_saml_exchange_key in sops (64 hex characters, bin/gen-service-secrets).
wazuh_manager_saml_metadata_file: "{{ playbook_dir }}/../files/{{ lab_env }}/wazuh-saml-metadata.xml"
# The address browsers use; must match wazuh_dashboard_url in tofu/authentik/<env>/main.tf (SAML ACS)
wazuh_manager_dashboard_url: "https://{{ ansible_host }}"
wazuh_manager_saml_entity_id: wazuh-saml
# Backend roles sent by Authentik's "Roles" attribute, and what they become
wazuh_manager_saml_admin_backend_role: wazuh-admins
wazuh_manager_saml_readonly_backend_role: wazuh-readonly
# Inside the indexer container (mounted from config/wazuh_indexer/saml/ on the host)
wazuh_manager_saml_dir_container: "{{ wazuh_manager_indexer_home }}/config/opensearch-security/saml"
