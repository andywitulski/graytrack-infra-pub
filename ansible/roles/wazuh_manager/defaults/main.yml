    line: >-
      4151 6 tap4151i0-IN 29/Oct/2026:19:48:46 -0400 ACCEPT: IN=fwbr4151i0 OUT=fwbr4151i0 PHYSIN=fwln4151i0
      PHYSOUT=tap4151i0 MAC=ff:ff:ff:ff:ff:ff:00:00:5e:00:53:21:08:00 SRC=0.0.0.0 DST=255.255.255.255 LEN=328 TOS=0x00
      PREC=0x00 TTL=64 ID=24081 PROTO=UDP SPT=68 DPT=67 LEN=308
  - rule: "100444"
    line: >-
      4151 6 tap4151i0-IN 28/Oct/2026:21:00:11 -0400 ACCEPT: IN=fwbr4151i0 OUT=fwbr4151i0 PHYSIN=fwln4151i0
      PHYSOUT=tap4151i0 MAC=33:33:00:00:00:16:00:00:5e:00:53:22:86:dd SRC=fe80::200:5eff:fe00:5301 DST=ff02::16 LEN=36
      TC=0 FLOWLBL=0 HOPLIMIT=1 NEXTHDR=HOPOPTS PROTO=ICMPV6 TYPE=143 CODE=0
  # The Wazuh agent's own CIS check ("auditctl -l" from /var/ossec, no login session), and the same
