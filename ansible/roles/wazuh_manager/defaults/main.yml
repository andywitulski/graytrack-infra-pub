---
# Wazuh single-node server (indexer, manager, dashboard) from the official wazuh-docker release.
# Upgrades are deliberate: bump wazuh_manager_version, then follow Wazuh's Docker upgrade guide (the role only
# extracts a release into an empty directory and never overwrites an existing deployment).
# renovate: datasource=github-releases depName=wazuh/wazuh-docker
wazuh_manager_version: "4.14.8"
wazuh_manager_docker_dir: /opt/wazuh-docker
wazuh_manager_dir: "{{ wazuh_manager_docker_dir }}/single-node"
wazuh_manager_release_url: "https://github.com/wazuh/wazuh-docker/archive/refs/tags/v{{ wazuh_manager_version }}.tar.gz"

# Published defaults of the Docker deployment, used only to detect and replace them.
wazuh_manager_default_admin_password: SecretPassword
wazuh_manager_default_api_password: "MyS3cr37P450r.*-"

# From sops (group_vars/all/secrets.sops.yml):
#   wazuh_admin_password, wazuh_kibanaserver_password, wazuh_api_password, wazuh_enrollment_password
# Characters are restricted (no $ ' " \ or whitespace): they are written into docker-compose.yml and YAML.

# Paths inside the indexer container (wazuh-docker 4.14 layout)
wazuh_manager_indexer_home: /usr/share/wazuh-indexer
# How long to wait for the indexer after compose up, in 10 s steps (a first start on a small VM is slow)
wazuh_manager_indexer_wait_retries: 30

# ---------------------------------------------------------------- log sources (tasks/sources.yml)
# Hosts allowed to send syslog to the manager (UDP, unauthenticated: keep this to exact addresses).
# Empty = no syslog listener. Prod sets the UniFi gateway in group_vars/wazuh_manager.yml.
wazuh_manager_syslog_allowed_ips: []
wazuh_manager_syslog_port: 514

# Custom ruleset files written into the manager: src ending in .j2 is a template, anything else a file
wazuh_manager_ruleset_files:
  - { src: labstack_decoders.xml.j2, dest: /var/ossec/etc/decoders/labstack_decoders.xml }
  - { src: labstack_rules.xml, dest: /var/ossec/etc/rules/labstack_rules.xml }
  # Loads after labstack_rules.xml (files load in name order): its rules extend 100306 from there
  - { src: labstack_tuning.xml.j2, dest: /var/ossec/etc/rules/labstack_tuning.xml }
# Earlier names of ruleset files, removed from the manager
wazuh_manager_retired_ruleset_files:
  - /var/ossec/etc/rules/labstack_host_rules.xml
# The automation account and the addresses it may log in from: the controllers, lab_controllers in the
# env inventory (admin workstation and paw01 in prod). labstack_tuning.xml: 100401 hides its sudo noise, 100402
# alerts at level 10 when it logs in from anywhere else.
wazuh_manager_automation_user: ansible
wazuh_manager_automation_sources: "{{ lab_controllers }}"
# Its numeric UID on the hosts (audit events carry auid, not names)
wazuh_manager_automation_uid: 1000

# Self-test after every deployment: each line goes through wazuh-logtest and must hit its rule.
# Lines look the way the manager receives them (journald entries arrive in syslog format).
wazuh_manager_logtest_samples:
  # Tuning (labstack_tuning.xml): real lines from the hosts and the gateway
  - rule: "100400"
    line: "Oct 10 09:36:14 pve03 sudo[1383046]: pam_unix(sudo:session): session opened for user root(uid=0) by ansible(uid=1000)"
  - rule: "100401"
    line: >-
      Oct 10 09:36:16 pve03 sudo[1383078]:  ansible : PWD=/home/ansible ; USER=root ;
      COMMAND=/bin/sh -c 'echo BECOME-SUCCESS-hvehnahwyoswfalipfbmhkycdqmgvjgi ; /usr/bin/python3.13'
  - rule: "100402"
    line: >-
      Oct 10 09:42:16 files01 sshd-session[19419]: Accepted publickey for ansible from __LAN_NET__.99 port 51204
      ssh2: ED25519 SHA256:51YFKFVJseTjPACErzR/AoMb4u7TSEL/Vq4VmsR28nY
  # A plain key from the controller: allowed until ssh_ca_enforce, a standing key after it
  - rule: "{{ '100452' if ssh_ca_enforce | default(false) | bool else '5715' }}"
    line: >-
      Oct 10 09:42:16 files01 sshd-session[19419]: Accepted publickey for ansible from {{ wazuh_manager_automation_sources | first }} port 51204
      ssh2: ED25519 SHA256:51YFKFVJseTjPACErzR/AoMb4u7TSEL/Vq4VmsR28nY
  # SSH certificates from ca01 (lines as sshd writes them)
