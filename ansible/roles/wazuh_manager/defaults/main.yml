      proctitle=617564697463746C002D44
  - rule: "100447"
    line: "2026-10-29 04:49:49 status half-configured step-ca:amd64 0.30.2-1"
  - rule: "100430"
    line: >-
      type=SYSCALL msg=audit(1791629000.123:4567): arch=c000003e syscall=257 success=yes exit=3 a0=ffffff9c a1=55d2 a2=241
