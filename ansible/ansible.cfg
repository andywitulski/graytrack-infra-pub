[defaults]
inventory = inventories/common,inventories/dev
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519_ansible
host_key_checking = True
interpreter_python = auto_silent
callback_result_format = yaml
log_path = ~/.local/state/labstack/ansible.log
collections_path = ./collections
# Last wins: secrets from OpenBao (plugins/vars/labstack_openbao.py) over sops while both hold a key
vars_plugins = ./plugins/vars
vars_plugins_enabled = host_group_vars,community.sops.sops,labstack_openbao
roles_path = roles

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
